<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/mqtt@5.0.5/dist/mqtt.min.js"></script>
</head>
<body style="margin:0; padding:0; background: #1a1a1a; color: #0f0; font-family: monospace; font-size: 11px; overflow: hidden;">
    <div id="log" style="padding: 5px; height: 100vh; overflow-y: auto;">[Motor MQTT] Iniciando...</div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            if (window.parent) window.parent.postMessage({ type: 'LOG', data: msg }, '*');
        }

        let miId = null;
        let cliente = null;
        let conectado = false;
        let idRemoto = null;
        let bufferMensajes = [];
        let reconectarTimeout = null;

        function enviarAPrincipal(tipo, datos) {
            if (window.parent) window.parent.postMessage({ type: tipo, data: datos }, '*');
        }

        function conectarMQTT(id) {
            miId = id;
            log(`🔑 ID: ${miId}`);
            enviarAPrincipal('MI_ID', miId);

            // Usamos broker público de Mosquitto (más fiable)
            const brokerUrl = 'wss://test.mosquitto.org:8081/mqtt';
            log('📡 Conectando a broker Mosquitto...');
            
            if (cliente) {
                cliente.end(true);
            }

            cliente = mqtt.connect(brokerUrl, {
                reconnectPeriod: 5000, // Reintentar cada 5 segundos
                connectTimeout: 30000,
                keepalive: 60
            });

            cliente.on('connect', () => {
                log('✅ Conectado al broker Mosquitto');
                conectado = true;
                enviarAPrincipal('CAPA_ACTUAL', 'MQTT (Mosquitto)');
                const topic = `arbolapp/usuario/${miId}`;
                cliente.subscribe(topic, (err) => {
                    if (err) log(`Error al suscribirse: ${err}`);
                    else log(`📡 Suscrito a ${topic}`);
                });
                // Enviar mensajes pendientes
                while (bufferMensajes.length) {
                    const { texto, destino } = bufferMensajes.shift();
                    enviarMensajeMQTT(texto, destino);
                }
                // Notificar conexión establecida (simulada)
                enviarAPrincipal('CONEXION_ESTABLECIDA');
            });

            cliente.on('message', (topic, message) => {
                const payload = message.toString();
                try {
                    const datos = JSON.parse(payload);
                    if (datos.sender === miId) return; // ignorar propios
                    log(`📨 Recibido de ${datos.sender}: ${datos.text}`);
                    enviarAPrincipal('MENSAJE_RECIBIDO', datos.text);
                    if (!idRemoto) {
                        idRemoto = datos.sender;
                        enviarAPrincipal('LLAMADA_ENTRANTE', idRemoto);
                    }
                } catch (e) {
                    log(`Error procesando mensaje: ${e}`);
                }
            });

            cliente.on('error', (err) => {
                log(`❌ Error MQTT: ${err.message}`);
                enviarAPrincipal('ERROR_P2P', err.message);
                conectado = false;
            });

            cliente.on('close', () => {
                log('🔌 Desconectado del broker');
                conectado = false;
                enviarAPrincipal('CONEXION_CERRADA');
                // Intentar reconectar después de un tiempo (ya lo hace mqtt.js automáticamente con reconnectPeriod)
            });

            cliente.on('offline', () => {
                log('📴 Modo offline');
                conectado = false;
            });
        }

        function enviarMensajeMQTT(texto, destino) {
            if (!cliente || !conectado) {
                log('No conectado, guardando en buffer');
                bufferMensajes.push({ texto, destino });
                return;
            }
            const topic = `arbolapp/usuario/${destino}`;
            const mensaje = {
                sender: miId,
                text: texto,
                timestamp: Date.now()
            };
            cliente.publish(topic, JSON.stringify(mensaje), { qos: 0 }, (err) => {
                if (err) log(`Error al publicar: ${err}`);
                else log(`Mensaje enviado a ${destino}`);
            });
        }

        function iniciarConId(id) {
            if (cliente) {
                cliente.end(true);
            }
            bufferMensajes = [];
            conectarMQTT(id);
        }

        function reiniciarConId(nuevoId) {
            log(`🔄 Reiniciando con nuevo ID: ${nuevoId}`);
            if (cliente) {
                cliente.end(true);
            }
            bufferMensajes = [];
            conectarMQTT(nuevoId);
        }

        function enviarMensaje(texto, destino) {
            if (!destino) return log('Error: destino no especificado');
            enviarMensajeMQTT(texto, destino);
        }

        function conectar(destino) {
            idRemoto = destino;
            log(`Objetivo establecido: ${destino}`);
            // No necesitamos hacer nada más, ya estamos suscritos a nuestro topic
            // Pero podemos enviar un mensaje de presencia si se desea
        }

        window.addEventListener('message', (event) => {
            const { type, data } = event.data;
            switch (type) {
                case 'INIT':
                    iniciarConId(data.id);
                    break;
                case 'ENVIAR_MENSAJE':
                    enviarMensaje(data.texto, data.idRemoto);
                    break;
                case 'CONECTAR':
                    conectar(data.idRemoto);
                    break;
                case 'REINICIAR_CON_ID':
                    reiniciarConId(data.id);
                    break;
            }
        });

        log('Esperando ID desde la página principal...');
    </script>
</body>
</html>
