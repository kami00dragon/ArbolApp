<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Librería MQTT sobre WebSockets -->
    <script src="https://unpkg.com/mqtt@5.0.5/dist/mqtt.min.js"></script>
    <!-- Para cifrado (mantenemos la misma función) -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script> <!-- solo por SEA? mejor implementamos cifrado simple -->
</head>
<body style="margin:0; padding:0; background: #1a1a1a; color: #0f0; font-family: monospace; font-size: 11px; overflow: hidden;">
    <div id="log" style="padding: 5px; height: 100vh; overflow-y: auto;">[Motor MQTT] Iniciando...</div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            if (window.parent) window.parent.postMessage({ type: 'LOG', data: msg }, '*');
        }

        let miId = null;
        let cliente = null;
        let conectado = false;
        let idRemoto = null;
        let bufferMensajes = [];

        // --- Encriptación simple (reutilizando la tuya) ---
        const ENC_SALT = "arbolapp-static-salt-v2";
        async function getCryptoKey(password) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
            return window.crypto.subtle.deriveKey({ name: "PBKDF2", salt: enc.encode(ENC_SALT), iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
        }
        async function encryptMessage(text, password) {
            if (!password) return null;
            try {
                const key = await getCryptoKey(password);
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const encoded = new TextEncoder().encode(text);
                const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
                return { iv: btoa(String.fromCharCode(...iv)), ciphertext: btoa(String.fromCharCode(...new Uint8Array(ciphertext))), encrypted: true };
            } catch(e) { console.error(e); return null; }
        }
        async function decryptMessage(encryptedObj, password) {
            try {
                const key = await getCryptoKey(password);
                const iv = new Uint8Array(atob(encryptedObj.iv).split("").map(c => c.charCodeAt(0)));
                const data = new Uint8Array(atob(encryptedObj.ciphertext).split("").map(c => c.charCodeAt(0)));
                const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
                return new TextDecoder().decode(decrypted);
            } catch (e) { throw new Error("Clave incorrecta"); }
        }

        function enviarAPrincipal(tipo, datos) {
            if (window.parent) window.parent.postMessage({ type: tipo, data: datos }, '*');
        }

        // --- Conectar a broker MQTT ---
        function conectarMQTT(id) {
            miId = id;
            log(`🔑 ID: ${miId}`);
            enviarAPrincipal('MI_ID', miId);

            // Usamos broker público HiveMQ (WebSocket seguro)
            const brokerUrl = 'wss://broker.hivemq.com:8000/mqtt';
            log('📡 Conectando a broker MQTT...');
            cliente = mqtt.connect(brokerUrl);

            cliente.on('connect', () => {
                log('✅ Conectado al broker');
                conectado = true;
                enviarAPrincipal('CAPA_ACTUAL', 'MQTT');
                // Suscribirse a nuestro tema
                const topic = `arbolapp/usuario/${miId}`;
                cliente.subscribe(topic, (err) => {
                    if (err) log(`Error al suscribirse: ${err}`);
                    else log(`📡 Suscrito a ${topic}`);
                });
                // Enviar mensajes pendientes
                while (bufferMensajes.length) {
                    const { texto, destino } = bufferMensajes.shift();
                    enviarMensajeMQTT(texto, destino);
                }
            });

            cliente.on('message', async (topic, message) => {
                // El mensaje es un buffer, convertirlo a string
                const payload = message.toString();
                try {
                    const datos = JSON.parse(payload);
                    if (datos.sender === miId) return; // ignorar propios mensajes

                    let textoFinal = datos.text;
                    // Si está cifrado, intentar descifrar con la contraseña de la UI (la obtendremos desde la página principal)
                    if (datos.encrypted) {
                        // Necesitamos la contraseña. La UI nos la pasará cuando escriba.
                        // Por ahora, lo manejaremos igual que antes: si no hay contraseña, mostramos candado.
                        // Para simplificar, aquí asumimos que no hay cifrado, pero podríamos pedir la clave desde la UI.
                        // O podemos enviar la contraseña con cada mensaje (no recomendado).
                        // Lo dejamos para una mejora futura.
                        textoFinal = '🔒 Mensaje cifrado';
                    }
                    log(`📨 Recibido de ${datos.sender}: ${textoFinal}`);
                    enviarAPrincipal('MENSAJE_RECIBIDO', textoFinal);
                    // También notificar llamada entrante si es el primer mensaje de ese remoto?
                    if (!idRemoto) {
                        idRemoto = datos.sender;
                        enviarAPrincipal('LLAMADA_ENTRANTE', idRemoto);
                    }
                } catch (e) {
                    log(`Error procesando mensaje: ${e}`);
                }
            });

            cliente.on('error', (err) => {
                log(`❌ Error MQTT: ${err}`);
                enviarAPrincipal('ERROR_P2P', err.toString());
            });

            cliente.on('close', () => {
                log('🔌 Desconectado del broker');
                conectado = false;
                enviarAPrincipal('CONEXION_CERRADA');
            });
        }

        // --- Enviar mensaje por MQTT ---
        function enviarMensajeMQTT(texto, destino) {
            if (!cliente || !conectado) {
                log('No conectado, guardando en buffer');
                bufferMensajes.push({ texto, destino });
                return;
            }
            const topic = `arbolapp/usuario/${destino}`;
            const mensaje = {
                sender: miId,
                text: texto,
                timestamp: Date.now()
                // podríamos añadir cifrado aquí si la UI lo pide
            };
            cliente.publish(topic, JSON.stringify(mensaje), { qos: 0 }, (err) => {
                if (err) log(`Error al publicar: ${err}`);
                else log(`Mensaje enviado a ${destino}`);
            });
        }

        // --- Interfaz con la página principal ---
        function iniciarConId(id) {
            if (cliente) cliente.end();
            conectarMQTT(id);
        }

        function reiniciarConId(nuevoId) {
            log(`🔄 Reiniciando con nuevo ID: ${nuevoId}`);
            if (cliente) cliente.end();
            bufferMensajes = [];
            conectarMQTT(nuevoId);
        }

        function enviarMensaje(texto, destino) {
            if (!destino) return log('Error: destino no especificado');
            enviarMensajeMQTT(texto, destino);
        }

        function conectar(destino) {
            idRemoto = destino;
            log(`Objetivo establecido: ${destino}`);
            // No necesitamos hacer nada más, ya estamos suscritos a nuestro propio topic
            enviarAPrincipal('CONEXION_ESTABLECIDA'); // simulamos conexión
        }

        window.addEventListener('message', (event) => {
            const { type, data } = event.data;
            switch (type) {
                case 'INIT':
                    iniciarConId(data.id);
                    break;
                case 'ENVIAR_MENSAJE':
                    enviarMensaje(data.texto, data.idRemoto);
                    break;
                case 'CONECTAR':
                    conectar(data.idRemoto);
                    break;
                case 'REINICIAR_CON_ID':
                    reiniciarConId(data.id);
                    break;
            }
        });

        log('Esperando ID desde la página principal...');
    </script>
</body>
</html>
