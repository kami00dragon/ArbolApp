<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Cargar las librerías P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@rtco/client@latest/dist/rtco.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>
<body style="margin:0; padding:0; background: #1a1a1a; color: #0f0; font-family: monospace; font-size: 11px; overflow: hidden;">
    <div id="log" style="padding: 5px; height: 100vh; overflow-y: auto;">[Motor] Iniciando...</div>

    <script>
        // ============================================================
        // MOTOR P2P (recibe ID desde la página principal)
        // ============================================================
        const logDiv = document.getElementById('log');
        function log(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            if (window.parent) {
                window.parent.postMessage({ type: 'LOG', data: msg }, '*');
            }
        }

        // --- Variables de estado ---
        let miId = null;
        let capaActiva = 0; // 0: ninguna, 1: ARtico, 2: simple-peer, 3: PeerJS
        let conexionActiva = null;
        let idRemoto = null;
        let bufferMensajes = [];
        let callbacks = {};

        // --- Enviar a página principal ---
        function enviarAPrincipal(tipo, datos = null) {
            if (window.parent) {
                window.parent.postMessage({ type: tipo, data: datos }, '*');
            }
        }

        // --- Inicialización con ID recibido ---
        function iniciarConId(id) {
            miId = id;
            log(`🔑 ID asignado por la página: ${miId}`);
            enviarAPrincipal('MI_ID', miId);

            // Intentar capa 1: ARtico (si está disponible)
            if (typeof Artico !== 'undefined') {
                iniciarArtico();
            } else if (typeof Peer !== 'undefined') {
                iniciarPeerJS();
            } else {
                log('❌ Ninguna librería P2P disponible');
                enviarAPrincipal('ERROR_P2P', 'No hay librerías P2P');
            }
        }

        // --- Capa 1: ARtico ---
        function iniciarArtico() {
            capaActiva = 1;
            enviarAPrincipal('CAPA_ACTUAL', 'ARtico (capa 1)');
            log('📡 Capa 1: ARtico');

            try {
                const rtco = new Artico(miId);

                rtco.on('open', (id) => {
                    log(`✅ ARtico listo. ID: ${id}`);
                });

                rtco.on('call', (call) => {
                    log(`📞 Llamada ARtico entrante de: ${call.peer}`);
                    idRemoto = call.peer;
                    enviarAPrincipal('LLAMADA_ENTRANTE', idRemoto);
                    call.answer();
                    configurarConexion(call);
                });

                rtco.on('error', (err) => {
                    log(`❌ Error ARtico: ${err.message}`);
                    log('⬇️ Cambiando a capa 3 (PeerJS)');
                    iniciarPeerJS();
                });

                callbacks.rtco = rtco;
            } catch (e) {
                log(`❌ Excepción ARtico: ${e.message}`);
                iniciarPeerJS();
            }
        }

        // --- Capa 3: PeerJS (directo) ---
        function iniciarPeerJS() {
            capaActiva = 3;
            enviarAPrincipal('CAPA_ACTUAL', 'PeerJS (capa 3)');
            log('📡 Capa 3: PeerJS');

            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };

            try {
                const peer = new Peer(miId, config);

                peer.on('open', (id) => {
                    log(`✅ PeerJS listo. ID: ${id}`);
                });

                peer.on('connection', (conn) => {
                    log(`📞 Llamada PeerJS entrante de: ${conn.peer}`);
                    idRemoto = conn.peer;
                    enviarAPrincipal('LLAMADA_ENTRANTE', idRemoto);
                    configurarConexion(conn);
                });

                peer.on('error', (err) => {
                    log(`❌ Error PeerJS: ${err.type}`);
                    enviarAPrincipal('ERROR_P2P', `PeerJS: ${err.type}`);
                });

                callbacks.peer = peer;
            } catch (e) {
                log(`❌ Excepción PeerJS: ${e.message}`);
                enviarAPrincipal('ERROR_P2P', 'Falló PeerJS');
            }
        }

        // --- Configurar conexión (genérico) ---
        function configurarConexion(conn) {
            conexionActiva = conn;

            conn.on('open', () => {
                log('✅ Conexión establecida');
                enviarAPrincipal('CONEXION_ESTABLECIDA');
                while (bufferMensajes.length) {
                    const msg = bufferMensajes.shift();
                    conn.send(msg);
                    log(`Mensaje enviado (buffer): ${msg}`);
                }
            });

            conn.on('data', (data) => {
                log(`📨 Recibido: ${data}`);
                enviarAPrincipal('MENSAJE_RECIBIDO', data);
            });

            conn.on('close', () => {
                log('🔒 Conexión cerrada');
                conexionActiva = null;
                idRemoto = null;
                enviarAPrincipal('CONEXION_CERRADA');
            });

            conn.on('error', (err) => {
                log(`🔥 Error en conexión: ${err}`);
                enviarAPrincipal('ERROR_P2P', err.toString());
            });
        }

        // --- Conectar a un peer ---
        function conectarA(destino) {
            if (destino === miId) {
                log('No te conectes a ti mismo');
                return;
            }
            idRemoto = destino;
            log(`Intentando conectar a: ${destino} (capa ${capaActiva})`);

            if (capaActiva === 1 && callbacks.rtco) {
                try {
                    const call = callbacks.rtco.call(destino);
                    configurarConexion(call);
                } catch (err) {
                    log(`Error llamada ARtico: ${err.message}`);
                }
            } else if (capaActiva === 3 && callbacks.peer) {
                const conn = callbacks.peer.connect(destino, { reliable: true });
                configurarConexion(conn);
            } else {
                log('No hay capa activa para conectar');
            }
        }

        // --- Enviar mensaje ---
        function enviarMensaje(texto, destino) {
            if (conexionActiva && typeof conexionActiva.send === 'function') {
                conexionActiva.send(texto);
                log(`Mensaje enviado: ${texto}`);
            } else {
                log(`Mensaje en buffer: ${texto}`);
                bufferMensajes.push(texto);
                if (destino && destino !== idRemoto) {
                    conectarA(destino);
                }
            }
        }

        // --- Reiniciar con nuevo ID ---
        function reiniciarConId(nuevoId) {
            log(`🔄 Reiniciando motor con nuevo ID: ${nuevoId}`);
            // Cerrar conexiones
            if (conexionActiva && typeof conexionActiva.close === 'function') conexionActiva.close();
            if (callbacks.rtco) callbacks.rtco.destroy();
            if (callbacks.peer) callbacks.peer.destroy();
            callbacks = {};
            bufferMensajes = [];
            // Iniciar de nuevo
            iniciarConId(nuevoId);
        }

        // --- Escuchar comandos de la página principal ---
        window.addEventListener('message', (event) => {
            const { type, data } = event.data;

            switch (type) {
                case 'INIT':
                    iniciarConId(data.id);
                    break;
                case 'ENVIAR_MENSAJE':
                    enviarMensaje(data.texto, data.idRemoto);
                    break;
                case 'CONECTAR':
                    conectarA(data.idRemoto);
                    break;
                case 'REINICIAR_CON_ID':
                    reiniciarConId(data.id);
                    break;
            }
        });

        // Esperar instrucciones de la página principal (el ID)
        log('Esperando ID desde la página principal...');
    </script>
</body>
</html>
