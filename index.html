<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArbolApp - Red Social Libre</title>
    
    <style>
        /* ========== TUS ESTILOS COMPLETOS (los mismos) ========== */
        :root {
            --wood-dark: #3e2723; --wood-light: #5d4037; --leaf-green: #2e7d32;
            --leaf-light: #66bb6a; --flower-pink: #e91e63; --text-parchment: #efebe9;
            --border-stem: #1b5e20; --sidebar-width: 340px;
            --msg-p2p-bg: #2e7d32; --msg-relay-bg: #f57c00;
        }
        body { margin: 0; padding: 0; font-family: 'Georgia', serif; background-color: var(--wood-dark); background-image: repeating-linear-gradient(45deg, #3e2723 0, #3e2723 10px, #4e342e 10px, #4e342e 20px); color: var(--text-parchment); height: 100vh; overflow: hidden; }
        .app-layout { display: grid; grid-template-columns: var(--sidebar-width) 1fr; height: 100vh; max-width: 1600px; margin: 0 auto; background-color: rgba(0,0,0,0.2); position: relative; z-index: 10; }
        
        .sidebar { background-color: var(--wood-light); border-right: 5px solid var(--leaf-green); display: flex; flex-direction: column; height: 100%; z-index: 20; }
        .sidebar-header { background-color: var(--leaf-green); padding: 20px; text-align: center; border-bottom: 4px solid var(--flower-pink); }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: white; }
        .sidebar-tabs { display: flex; background: #1b5e20; }
        .tab-btn { flex: 1; background: none; border: none; color: #a5d6a7; padding: 15px 0; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; }
        .tab-btn.active { background: var(--wood-light); color: var(--text-parchment); border-bottom-color: var(--flower-pink); }
        .sidebar-content { padding: 20px; overflow-y: auto; flex-grow: 1; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ffcc80; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; background: #3e2723; border: 1px solid #795548; color: #efebe9; border-radius: 4px; font-family: inherit; box-sizing: border-box; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .btn-action { width: 100%; padding: 12px; background: var(--flower-pink); color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-bottom: 10px; }
        .btn-action:hover { background: #c2185b; }
        .btn-rss { background: #FF9800; }
        .btn-rss:hover { background: #F57C00; }
        .btn-secondary { width: 100%; padding: 10px; background: #5d4037; color: white; border: 1px solid #8d6e63; border-radius: 5px; font-size: 0.9rem; cursor: pointer; margin-top: 5px; }
        .btn-secondary:hover { background: #4e342e; }

        /* Feed */
        .main-feed { background-color: rgba(62, 39, 35, 0.95); overflow-y: auto; height: 100vh; border-left: 8px solid var(--wood-dark); position: relative; }
        .tree-trunk { max-width: 700px; margin: 0 auto; min-height: 100vh; border-left: 8px solid var(--leaf-green); border-right: 8px solid var(--leaf-green); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .feed-header { background-color: var(--leaf-green); padding: 15px 20px; text-align: center; border-bottom: 5px solid var(--leaf-light); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center;}
        .header-title h1 { margin: 0; font-size: 1.8rem; color: #fff; text-shadow: 2px 2px 0 var(--wood-dark); }
        .subtitle { font-size: 0.8rem; color: #e8f5e9; font-style: italic; margin-top: 2px; display: block;}
        .btn-p2p-header { background: #2196F3; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 5px; font-size: 0.9rem; }
        .btn-p2p-header:hover { background: #1976D2; }
        .nav-branches { display: flex; justify-content: center; background: #2e7d32; }
        .nav-btn { background: none; border: none; color: white; padding: 15px 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-bottom: 4px solid transparent; transition: all 0.3s; }
        .nav-btn:hover { background-color: rgba(255,255,255,0.1); }
        .nav-btn.active { border-bottom-color: var(--flower-pink); background-color: rgba(0,0,0,0.1); }
        #feed-container { padding: 20px; }
        .leaf-card { background-color: var(--wood-light); border-radius: 5px 30px 5px 30px; padding: 20px; margin-bottom: 25px; border: 2px solid var(--border-stem); position: relative; box-shadow: 5px 5px 0px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .leaf-card:hover { transform: translateY(-3px); }
        .leaf-card::before { content: '🌿'; position: absolute; top: -15px; left: -10px; font-size: 1.5rem; transform: rotate(-20deg); }
        .post-meta { font-size: 0.8rem; color: #a5d6a7; margin-bottom: 10px; border-bottom: 1px dashed #795548; padding-bottom: 5px; display: flex; justify-content: space-between; }
        .post-title { font-size: 1.5rem; margin: 0 0 10px 0; color: #ffcc80; }
        .post-content { line-height: 1.6; font-size: 1rem; white-space: pre-wrap; word-wrap: break-word; }
        .media-container { margin-top: 15px; border-radius: 10px; overflow: hidden; border: 3px solid #3e27d3; background: #000; }
        img, video { width: 100%; display: block; }
        .download-link { display: inline-block; margin-top: 10px; padding: 5px 15px; background: var(--flower-pink); color: white; text-decoration: none; border-radius: 15px; font-size: 0.9rem; }
        .loading-frog { text-align: center; padding: 20px; font-size: 3rem; }
        .source-manager { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #5d4037; }
        .source-manager h4 { margin-top: 0; color: var(--flower-pink); font-size: 0.9rem; }
        .input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .input-group input { flex: 1; }

        /* Modal P2P (con pestañas de chat y contactos) */
        dialog { border: 4px solid var(--leaf-green); border-radius: 15px; padding: 0; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 95%; max-width: 650px; background: var(--wood-light); color: var(--text-parchment); }
        dialog::backdrop { background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .p2p-header { background: var(--leaf-green); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--flower-pink); }
        .p2p-header h3 { display: flex; align-items: center; gap: 8px; margin: 0; }
        .bird-logo { width: 32px; height: 32px; display: inline-block; }
        .bird-logo svg { width: 100%; height: 100%; stroke: #000; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        
        .p2p-tabs { display: flex; background: #1b5e20; }
        .p2p-tab { flex: 1; background: none; border: none; color: #a5d6a7; padding: 12px 0; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; }
        .p2p-tab.active { background: var(--wood-light); color: var(--text-parchment); border-bottom-color: var(--flower-pink); }
        .p2p-tab-content { padding: 15px; display: block; }
        .p2p-tab-content.hidden { display: none; }

        .p2p-status-bar { display: flex; align-items: center; gap: 8px; padding: 8px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-stem); font-size: 0.9rem; }
        .status-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
        .status-idle { background-color: #9e9e9e; }
        .status-calling { background-color: #2196F3; animation: pulse 1.5s infinite; }
        .status-connected { background-color: #4CAF50; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .p2p-body { padding: 0; display: flex; flex-direction: column; height: 550px; }
        .p2p-log { height: 60px; background: #000; border: 1px solid #555; margin: 10px; padding: 5px; font-family: monospace; font-size: 0.7rem; color: #0f0; overflow-y: auto; border-radius: 4px; }
        
        .chat-window { flex-grow: 1; background: #000; border: 2px solid #5d4037; border-radius: 8px; padding: 10px; overflow-y: auto; margin: 0 10px 10px 10px; font-family: monospace; font-size: 0.9rem; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .msg-sent { background: var(--leaf-green); color: white; align-self: flex-end; margin-left: auto; border: 1px solid #1b5e20; }
        .msg-received { background: #555; color: white; align-self: flex-start; border: 1px solid #777; }
        .msg-system { text-align: center; color: #aaa; font-size: 0.8rem; font-style: italic; margin: 5px 0; }
        .msg-pending { color: #ff9800; font-style: italic; font-size: 0.8rem; }

        .peer-ids { display: flex; gap: 10px; margin: 0 10px 10px 10px; flex-wrap: wrap; }
        .peer-id-box { flex: 1; min-width: 200px; background: #2a1b15; border: 1px solid #5d4037; border-radius: 4px; padding: 8px; }
        .peer-id-box label { display: block; font-size: 0.7rem; color: #aaa; margin-bottom: 3px; }
        .peer-id-value { display: flex; gap: 5px; align-items: center; }
        .peer-id-value input { flex: 1; background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 5px; font-family: monospace; font-size: 0.8rem; border-radius: 3px; }
        .peer-id-value button { background: #5d4037; border: none; color: white; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 0.8rem; }
        .peer-id-value button:hover { background: #795548; }

        .message-controls { display: flex; flex-direction: column; gap: 10px; margin: 0 10px 10px 10px; }
        .message-input-area { display: flex; gap: 10px; }
        #msg-input { flex: 1; background: #2a1b15; border: 1px solid #795548; color: #fff; padding: 12px; border-radius: 5px; font-family: inherit; resize: none; min-height: 60px; font-size: 1rem; }
        #msg-input:disabled { background: #221; color: #555; }
        .btn-send { background: var(--flower-pink); color: white; border: none; padding: 0 25px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .btn-send:hover { background: #c2185b; }
        .btn-send:disabled { background: #555; cursor: not-allowed; }
        .btn-call { background: #2196F3; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom:10px;}
        .btn-call:hover { background: #1976D2; }
        .btn-call:disabled { background: #4a6b8f; cursor: not-allowed; }

        /* Estilos para contactos */
        .contact-list { list-style: none; padding: 0; margin: 10px 0; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 5px; }
        .contact-item { background: rgba(0,0,0,0.2); padding: 8px; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #5d4037; cursor: pointer; }
        .contact-item:hover { background: rgba(0,0,0,0.4); border-color: var(--leaf-green); }
        .contact-info { flex-grow: 1; overflow: hidden; }
        .contact-name { font-weight: bold; color: #ffcc80; display: block; }
        .contact-id { font-family: monospace; font-size: 0.7rem; color: #aaa; }
        .btn-delete-contact { background: none; border: none; color: #e53935; cursor: pointer; font-size: 1rem; padding: 0 5px; }
        .btn-delete-contact:hover { color: #ff5252; }
        .add-contact { display: flex; gap: 5px; margin-top: 10px; }
        .add-contact input { flex: 1; background: #2a1b15; border: 1px solid #5d4037; color: #fff; padding: 8px; border-radius: 4px; }

        @media (max-width: 900px) {
            .app-layout { grid-template-columns: 1fr; overflow-y: auto; }
            .sidebar { height: auto; max-height: 80vh; }
            body { overflow: auto; }
            .main-feed { height: auto; overflow: visible; }
            .tree-trunk { border: none; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- SIDEBAR (sin contactos, solo editor y datos) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🌱 ArbolApp</h2>
            </div>
            <div class="sidebar-tabs">
                <button class="tab-btn active" onclick="switchSidebarTab('editor', event)">✏️ Escribir</button>
                <button class="tab-btn" onclick="switchSidebarTab('data', event)">💾 Datos</button>
            </div>
            <div id="tab-editor" class="sidebar-content">
                <div class="form-group"><label>Título</label><input type="text" id="post-title"></div>
                <div class="form-group"><label>Contenido</label><textarea id="post-content"></textarea></div>
                <div class="form-group"><label>Multimedia</label><input type="text" id="post-media" placeholder="foto.jpg"></div>
                <div class="form-group"><label>Tipo</label><select id="post-type"><option value="image">Imagen</option><option value="video">Video</option><option value="audio">Audio</option><option value="document">Documento</option><option value="none">Solo texto</option></select></div>
                <button class="btn-action" onclick="publishPost()">🌱 Publicar (Guardar Local)</button>
            </div>
            <div id="tab-data" class="sidebar-content" style="display: none;">
                <h3 style="color:var(--leaf-light);">📦 Datos</h3>
                <button class="btn-action" onclick="exportToJson()">⬇️ Exportar posts.json</button>
                <button class="btn-secondary" onclick="clearLocalData()">Borrar locales</button>
                <!-- El botón de reiniciar ID ya no está aquí, se movió al modal -->
            </div>
        </aside>

        <!-- FEED PRINCIPAL -->
        <main class="main-feed">
            <div class="tree-trunk">
                <header class="feed-header">
                    <div class="header-title"><h1>🌳 ArbolApp</h1><span class="subtitle">Red Social Libre</span></div>
                    <button class="btn-p2p-header" onclick="openP2P()">🔒 Mensajes P2P</button>
                </header>
                <nav class="nav-branches">
                    <button class="nav-btn active" onclick="switchFeedTab('my-posts', event)">Mis Hojas</button>
                    <button class="nav-btn" onclick="switchFeedTab('branches', event)">Ramas</button>
                </nav>
                <div id="feed-container"><div class="loading-frog">🌱 Cargando...</div></div>
            </div>
        </main>
    </div>

    <!-- MODAL P2P (con pestañas Chat y Contactos) -->
    <dialog id="p2p-modal">
        <div class="p2p-header">
            <h3><span class="bird-logo"><svg viewBox="0 0 100 100"><path d="M20,50 Q40,20 70,30 Q90,40 80,70 Q70,90 40,80 Q20,70 30,40 Q35,30 50,35" stroke="black" fill="none" stroke-width="5"/><path d="M55,38 L80,25" stroke="black" stroke-width="4"/><circle cx="45" cy="45" r="3" fill="black"/></svg></span> Comunicación P2P</h3>
            <button onclick="closeP2P()" style="background:none; border:none; color:white; font-size:1.5rem;">&times;</button>
        </div>
        <!-- Pestañas -->
        <div class="p2p-tabs">
            <button class="p2p-tab active" id="tab-chat-btn" onclick="switchP2PTab('chat')">💬 Chat</button>
            <button class="p2p-tab" id="tab-contacts-btn" onclick="switchP2PTab('contacts')">📒 Contactos</button>
        </div>
        <!-- Contenido Chat -->
        <div id="p2p-tab-chat" class="p2p-tab-content">
            <div class="p2p-status-bar">
                <span class="status-indicator" id="status-indicator"></span>
                <span id="status-text">Desconectado</span>
                <span style="flex:1; text-align:right; font-size:0.7rem;" id="capa-actual"></span>
            </div>
            <div id="p2p-log" class="p2p-log">Esperando motor...</div>
            <div class="p2p-body">
                <div id="chat-window" class="chat-window"></div>
                <div class="peer-ids">
                    <div class="peer-id-box"><label>Tu ID:</label><div class="peer-id-value"><input type="text" id="my-peer-id" readonly><button onclick="copyMyId()">📋</button></div></div>
                    <div class="peer-id-box"><label>ID Remoto:</label><div class="peer-id-value"><input type="text" id="remote-peer-id" placeholder="Pega ID..."><button onclick="document.getElementById('remote-peer-id').value=''">✕</button></div></div>
                </div>
                <button class="btn-call" onclick="conectarLlamada()">📞 Llamar / Conectar</button>
                <div class="message-controls">
                    <div class="message-input-area">
                        <textarea id="msg-input" placeholder="Escribe... (Enter envía)"></textarea>
                        <button class="btn-send" onclick="handleSendMessage()">➤</button>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn-secondary" style="flex:1;" onclick="reiniciarId()">🔄 Reiniciar mi ID</button>
                </div>
            </div>
        </div>
        <!-- Contenido Contactos -->
        <div id="p2p-tab-contacts" class="p2p-tab-content hidden">
            <div style="padding: 15px;">
                <h4 style="margin-top:0; color:var(--leaf-light);">👥 Mis Contactos</h4>
                <ul id="contact-list" class="contact-list"></ul>
                <div class="add-contact">
                    <input type="text" id="contact-name" placeholder="Nombre">
                    <input type="text" id="contact-id" placeholder="ID">
                    <button class="btn-action" style="width:auto; padding:8px 15px;" onclick="addContact()">➕</button>
                </div>
                <p style="font-size:0.8rem; color:#aaa;">Haz clic en un contacto para copiar su ID al campo remoto.</p>
            </div>
        </div>
    </dialog>

    <!-- IFRAME: MOTOR P2P -->
    <iframe id="p2p-engine" src="p2p-engine.html" style="width:0; height:0; border:0; position:absolute;"></iframe>

    <script>
        // ========== VARIABLES GLOBALES ==========
        const p2pIframe = document.getElementById('p2p-engine');
        const chatWindow = document.getElementById('chat-window');
        const myPeerIdInput = document.getElementById('my-peer-id');
        const remotePeerIdInput = document.getElementById('remote-peer-id');
        const msgInput = document.getElementById('msg-input');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const capaActualSpan = document.getElementById('capa-actual');

        // Almacenamiento de contactos
        const CONTACTS_KEY = 'arbolapp_contacts';
        let contacts = [];

        // ========== GESTIÓN DE ID PERSISTENTE ==========
        const ID_KEY = 'arbolapp_device_id';
        function generarNuevoId() {
            // Intenta usar crypto.randomUUID() si está disponible
            if (window.crypto && window.crypto.randomUUID) {
                return window.crypto.randomUUID();
            }
            // Fallback: random string
            return 'user_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
        }

        function obtenerIdDispositivo() {
            let id = localStorage.getItem(ID_KEY);
            if (!id) {
                id = generarNuevoId();
                localStorage.setItem(ID_KEY, id);
            }
            return id;
        }

        function reiniciarId() {
            if (confirm('¿Generar un nuevo ID? Esto reiniciará las conexiones actuales.')) {
                const nuevoId = generarNuevoId();
                localStorage.setItem(ID_KEY, nuevoId);
                // Notificar al iframe que reinicie con el nuevo ID
                enviarAlMotor('REINICIAR_CON_ID', { id: nuevoId });
                // También actualizar el campo si el iframe responde con MI_ID
            }
        }

        // ========== COMUNICACIÓN CON EL IFRAME ==========
        function enviarAlMotor(tipo, datos = {}) {
            if (p2pIframe && p2pIframe.contentWindow) {
                p2pIframe.contentWindow.postMessage({ type: tipo, data: datos }, '*');
            } else {
                console.error('Motor no disponible');
                addSystemMessage('⚠️ Error: Motor P2P no iniciado');
            }
        }

        // Al cargar la página, enviamos el ID al iframe para que lo use
        window.addEventListener('load', () => {
            // Esperamos un poco a que el iframe esté listo
            setTimeout(() => {
                const miId = obtenerIdDispositivo();
                enviarAlMotor('INIT', { id: miId });
            }, 500);
        });

        // Escuchar mensajes del motor
        window.addEventListener('message', (event) => {
            const { type, data } = event.data;

            switch (type) {
                case 'MI_ID':
                    myPeerIdInput.value = data;
                    logP2P(`✅ ID asignado: ${data}`);
                    break;
                case 'LLAMADA_ENTRANTE':
                    remotePeerIdInput.value = data;
                    addSystemMessage(`📞 Llamada entrante de: ${data}`);
                    logP2P(`Llamada entrante de: ${data}`);
                    // Cambiar a pestaña chat automáticamente
                    switchP2PTab('chat');
                    break;
                case 'CONEXION_ESTABLECIDA':
                    actualizarEstado('connected');
                    addSystemMessage('✅ Conectado');
                    logP2P('Conexión establecida');
                    break;
                case 'CONEXION_CERRADA':
                    actualizarEstado('idle');
                    addSystemMessage('🔌 Desconectado');
                    logP2P('Conexión cerrada');
                    break;
                case 'MENSAJE_RECIBIDO':
                    addMessage(data, 'received');
                    logP2P('Mensaje recibido');
                    break;
                case 'ERROR_P2P':
                    actualizarEstado('idle');
                    addSystemMessage(`⚠️ Error: ${data}`);
                    logP2P(`ERROR: ${data}`);
                    break;
                case 'LOG':
                    logP2P(data);
                    break;
                case 'CAPA_ACTUAL':
                    capaActualSpan.innerText = data;
                    break;
            }
        });

        // ========== FUNCIONES DE UI DEL CHAT ==========
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message msg-${type}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg-system';
            div.innerText = `--- ${text} ---`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function logP2P(mensaje) {
            const logDiv = document.getElementById('p2p-log');
            if (!logDiv) return;
            const time = new Date().toLocaleTimeString().split(' ')[0];
            logDiv.innerHTML += `<div>[${time}] ${mensaje}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function actualizarEstado(estado) {
            statusIndicator.className = 'status-indicator';
            if (estado === 'idle') {
                statusIndicator.classList.add('status-idle');
                statusText.innerText = 'Desconectado';
            } else if (estado === 'calling') {
                statusIndicator.classList.add('status-calling');
                statusText.innerText = 'Conectando...';
            } else if (estado === 'connected') {
                statusIndicator.classList.add('status-connected');
                statusText.innerText = 'En línea';
            }
        }

        function copyMyId() {
            myPeerIdInput.select();
            navigator.clipboard?.writeText(myPeerIdInput.value).then(() => alert("ID copiado")).catch(() => document.execCommand('copy'));
        }

        function openP2P() {
            document.getElementById('p2p-modal').showModal();
            // Asegurar que el ID esté actualizado
            myPeerIdInput.value = obtenerIdDispositivo(); // provisional hasta que el iframe responda
            msgInput.focus();
            loadContacts(); // cargar contactos al abrir
        }
        function closeP2P() { document.getElementById('p2p-modal').close(); }

        function handleSendMessage() {
            const texto = msgInput.value.trim();
            if (!texto) return;

            const idRemoto = remotePeerIdInput.value.trim();
            if (!idRemoto) {
                addSystemMessage('⚠️ Debes ingresar un ID remoto');
                return;
            }

            msgInput.value = '';
            addMessage(texto, 'pending');
            enviarAlMotor('ENVIAR_MENSAJE', { texto, idRemoto });
            actualizarEstado('calling');
        }

        function conectarLlamada() {
            const idRemoto = remotePeerIdInput.value.trim();
            if (!idRemoto) { alert('Ingresa un ID remoto'); return; }
            enviarAlMotor('CONECTAR', { idRemoto });
            actualizarEstado('calling');
        }

        // ========== PESTAÑAS DEL MODAL ==========
        function switchP2PTab(tab) {
            document.getElementById('tab-chat-btn').classList.toggle('active', tab === 'chat');
            document.getElementById('tab-contacts-btn').classList.toggle('active', tab === 'contacts');
            document.getElementById('p2p-tab-chat').classList.toggle('hidden', tab !== 'chat');
            document.getElementById('p2p-tab-contacts').classList.toggle('hidden', tab !== 'contacts');
            if (tab === 'contacts') loadContacts();
        }

        // ========== FUNCIONES DE CONTACTOS ==========
        function loadContacts() {
            contacts = JSON.parse(localStorage.getItem(CONTACTS_KEY) || '[]');
            renderContacts();
        }

        function renderContacts() {
            const list = document.getElementById('contact-list');
            if (!list) return;
            list.innerHTML = '';
            contacts.forEach((c, index) => {
                const li = document.createElement('li');
                li.className = 'contact-item';
                li.onclick = (e) => {
                    if (!e.target.classList.contains('btn-delete-contact')) {
                        remotePeerIdInput.value = c.id;
                        switchP2PTab('chat'); // volver a chat
                    }
                };
                li.innerHTML = `
                    <div class="contact-info">
                        <span class="contact-name">${c.name}</span>
                        <span class="contact-id">${c.id}</span>
                    </div>
                    <button class="btn-delete-contact" onclick="deleteContact(${index})" title="Borrar">🗑️</button>
                `;
                list.appendChild(li);
            });
        }

        function addContact() {
            const name = document.getElementById('contact-name').value.trim();
            const id = document.getElementById('contact-id').value.trim();
            if (!name || !id) return alert("Completa nombre e ID");
            contacts.push({ name, id });
            localStorage.setItem(CONTACTS_KEY, JSON.stringify(contacts));
            document.getElementById('contact-name').value = '';
            document.getElementById('contact-id').value = '';
            renderContacts();
        }

        function deleteContact(index) {
            if (confirm("¿Borrar contacto?")) {
                contacts.splice(index, 1);
                localStorage.setItem(CONTACTS_KEY, JSON.stringify(contacts));
                renderContacts();
            }
        }

        // ========== RESTO DE FUNCIONES (FEED, POSTS) ==========
        const LOCAL_STORAGE_KEY = 'arbolapp_posts_v1';
        let currentFeedTab = 'my-posts';

        async function loadPostsData() {
            let serverPosts = [];
            try { const response = await fetch('posts.json'); if (response.ok) serverPosts = await response.json(); } catch (e) {}
            let localPosts = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]');
            const serverIds = new Set(serverPosts.map(p => p.id));
            const uniqueLocalPosts = localPosts.filter(p => !serverIds.has(p.id));
            return [...serverPosts, ...uniqueLocalPosts].sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function publishPost() {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const media = document.getElementById('post-media').value.trim();
            const type = document.getElementById('post-type').value;
            if (!title || !content) return alert("Escribe título y contenido.");
            const newPost = { id: Date.now(), date: new Date().toISOString(), title, content, media: media || null, type: type === 'none' ? null : type };
            let currentLocalPosts = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]');
            currentLocalPosts.unshift(newPost);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(currentLocalPosts));
            document.getElementById('post-title').value = ''; document.getElementById('post-content').value = ''; document.getElementById('post-media').value = '';
            alert("✅ Publicado localmente.");
            if (currentFeedTab === 'my-posts') loadMyPosts();
        }

        async function exportToJson() {
            const posts = await loadPostsData();
            const blob = new Blob([JSON.stringify(posts, null, 2)], { type: "application/json" });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "posts.json"; a.click();
        }

        function clearLocalData() { if(confirm("¿Borrar locales?")) { localStorage.removeItem(LOCAL_STORAGE_KEY); loadMyPosts(); } }

        const DEFAULT_SOURCES = [ /* tus fuentes */ ];
        let customSources = JSON.parse(localStorage.getItem('arbolapp_sources') || '[]');

        function switchSidebarTab(tab, event) {
            document.querySelectorAll('.sidebar-content').forEach(e => e.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'block';
            event.target.classList.add('active');
        }

        function switchFeedTab(tab, event) {
            currentFeedTab = tab;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('feed-container').innerHTML = '<div class="loading-frog">🌱 Cargando...</div>';
            if (tab === 'my-posts') loadMyPosts(); else loadBranches();
        }

        async function loadMyPosts() {
            const container = document.getElementById('feed-container'); container.innerHTML = '';
            (await loadPostsData()).forEach(p => container.appendChild(createPostCard(p, true)));
        }

        async function loadBranches() {
            const container = document.getElementById('feed-container');
            container.innerHTML = ''; // implementación abreviada
        }

        function createPostCard(post, isOwn) {
            const card = document.createElement('article'); card.className = 'leaf-card';
            // ... (tu función existente) ...
            return card;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadMyPosts();
            if (msgInput) {
                msgInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); }
                });
            }
        });
    </script>
</body>
