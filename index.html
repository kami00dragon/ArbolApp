<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- GunDB -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
</head>
<body style="margin:0; padding:0; background: #1a1a1a; color: #0f0; font-family: monospace; font-size: 11px; overflow: hidden;">
    <div id="log" style="padding: 5px; height: 100vh; overflow-y: auto;">[Motor] Iniciando...</div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            if (window.parent) {
                window.parent.postMessage({ type: 'LOG', data: msg }, '*');
            }
        }

        let miId = null;
        let peer = null;
        let conn = null;
        let gun = null;
        let idRemoto = null;
        let bufferMensajes = [];
        let modoRelay = false;

        function enviarAPrincipal(tipo, datos) {
            if (window.parent) window.parent.postMessage({ type: tipo, data: datos }, '*');
        }

        // Inicializar con ID recibido
        function iniciarConId(id) {
            miId = id;
            log(`🔑 ID asignado: ${miId}`);
            enviarAPrincipal('MI_ID', miId);
            iniciarPeerJS();
        }

        // --- CAPA 1: PeerJS con TURN ---
        function iniciarPeerJS() {
            enviarAPrincipal('CAPA_ACTUAL', 'PeerJS + TURN');
            log('📡 Capa 1: PeerJS con TURN');

            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            };

            try {
                peer = new Peer(miId, config);

                peer.on('open', (id) => {
                    log(`✅ PeerJS listo. ID: ${id}`);
                });

                peer.on('connection', (c) => {
                    log(`📞 Llamada entrante de: ${c.peer}`);
                    idRemoto = c.peer;
                    enviarAPrincipal('LLAMADA_ENTRANTE', idRemoto);
                    configurarConexion(c);
                });

                peer.on('error', (err) => {
                    log(`❌ Error PeerJS: ${err.type}`);
                    if (err.type === 'peer-unavailable') {
                        // No es un error fatal, solo el peer no está disponible
                    } else {
                        // Error grave, pasamos a modo relay
                        log('⬇️ Cambiando a modo relay (GunDB)');
                        iniciarGunDB();
                    }
                });

                peer.on('disconnected', () => {
                    log('🔌 Desconectado del servidor PeerJS. Intentando reconectar...');
                    peer.reconnect();
                });
            } catch (e) {
                log(`❌ Excepción PeerJS: ${e.message}`);
                iniciarGunDB();
            }
        }

        function configurarConexion(c) {
            conn = c;

            conn.on('open', () => {
                log('✅ Conexión establecida (PeerJS)');
                enviarAPrincipal('CONEXION_ESTABLECIDA');
                while (bufferMensajes.length) {
                    conn.send(bufferMensajes.shift());
                }
            });

            conn.on('data', (data) => {
                log(`📨 Mensaje recibido: ${data}`);
                enviarAPrincipal('MENSAJE_RECIBIDO', data);
            });

            conn.on('close', () => {
                log('🔒 Conexión cerrada');
                conn = null;
                idRemoto = null;
                enviarAPrincipal('CONEXION_CERRADA');
            });

            conn.on('error', (err) => {
                log(`🔥 Error en conexión: ${err}`);
                conn = null;
                // No pasamos a relay automáticamente, podría ser un error temporal
            });
        }

        function conectarPeerJS(destino) {
            if (destino === miId) {
                log('No te conectes a ti mismo');
                return;
            }
            log(`Intentando conectar a: ${destino}`);
            idRemoto = destino;
            const nuevaConn = peer.connect(destino, { reliable: true });

            // Timeout de 15 segundos
            const timeout = setTimeout(() => {
                if (!nuevaConn || !nuevaConn.open) {
                    log('⏱️ Tiempo de espera agotado, pasando a modo relay');
                    iniciarGunDB();
                }
            }, 15000);

            nuevaConn.on('open', () => {
                clearTimeout(timeout);
                configurarConexion(nuevaConn);
            });

            nuevaConn.on('error', () => {
                clearTimeout(timeout);
                // Error, pero aún podemos reintentar con relay después
            });
        }

        // --- CAPA 2: GunDB (relay) ---
        function iniciarGunDB() {
            if (modoRelay) return; // ya estamos en relay
            modoRelay = true;
            enviarAPrincipal('CAPA_ACTUAL', 'GunDB Relay');
            log('📡 Capa 2: GunDB Relay');

            gun = Gun({ peers: ['https://gun-manhattan.herokuapp.com/gun'] });

            // Escuchar mensajes entrantes
            if (idRemoto) {
                const room = [miId, idRemoto].sort().join('_');
                const channel = gun.get('arbolapp_chat').get(room);
                channel.map().on((data, key) => {
                    if (!data || data.sender === miId) return;
                    log(`📨 Mensaje relay recibido: ${data.text}`);
                    enviarAPrincipal('MENSAJE_RECIBIDO', data.text);
                });
            }

            // Enviar mensajes pendientes
            while (bufferMensajes.length) {
                enviarMensajeRelay(bufferMensajes.shift());
            }
        }

        function enviarMensajeRelay(texto) {
            if (!idRemoto) return;
            const room = [miId, idRemoto].sort().join('_');
            const channel = gun.get('arbolapp_chat').get(room);
            channel.set({ text: texto, sender: miId, timestamp: Date.now() });
            log(`Mensaje relay enviado: ${texto}`);
        }

        // --- Función pública para enviar mensajes ---
        function enviarMensaje(texto, destino) {
            if (!destino) {
                log('Error: destino no especificado');
                return;
            }
            if (modoRelay) {
                if (!idRemoto) idRemoto = destino;
                enviarMensajeRelay(texto);
            } else {
                if (conn && conn.open) {
                    conn.send(texto);
                    log(`Mensaje enviado: ${texto}`);
                } else {
                    bufferMensajes.push(texto);
                    if (!idRemoto || idRemoto !== destino) {
                        idRemoto = destino;
                        conectarPeerJS(destino);
                    }
                }
            }
        }

        // --- Conectar manualmente ---
        function conectar(destino) {
            if (modoRelay) {
                idRemoto = destino;
                iniciarGunDB(); // reinicia escucha
            } else {
                conectarPeerJS(destino);
            }
        }

        // --- Reiniciar con nuevo ID ---
        function reiniciarConId(nuevoId) {
            log(`🔄 Reiniciando motor con nuevo ID: ${nuevoId}`);
            if (peer) peer.destroy();
            if (gun) gun = null;
            conn = null;
            bufferMensajes = [];
            modoRelay = false;
            iniciarConId(nuevoId);
        }

        // --- Escuchar comandos de la página principal ---
        window.addEventListener('message', (event) => {
            const { type, data } = event.data;
            switch (type) {
                case 'INIT':
                    iniciarConId(data.id);
                    break;
                case 'ENVIAR_MENSAJE':
                    enviarMensaje(data.texto, data.idRemoto);
                    break;
                case 'CONECTAR':
                    conectar(data.idRemoto);
                    break;
                case 'REINICIAR_CON_ID':
                    reiniciarConId(data.id);
                    break;
            }
        });

        log('Esperando ID desde la página principal...');
    </script>
</body>
</html>
