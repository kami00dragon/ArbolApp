<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArbolApp - Mensajería</title>
    <style>
        /* ========== ESTILOS (los mismos, no los repito por brevedad) ========== */
        /* Copia aquí los estilos de la versión anterior que funcionaban */
    </style>
</head>
<body>
    <!-- ... (el mismo HTML de la versión anterior) ... -->
    <!-- IFRAME con el motor MQTT -->
    <iframe id="p2p-engine" src="mqtt-engine.html" style="width:0; height:0; border:0; position:absolute;"></iframe>

    <script>
        // ========== VARIABLES GLOBALES (igual que antes) ==========
        const p2pIframe = document.getElementById('p2p-engine');
        const chatWindow = document.getElementById('chat-window');
        const myPeerIdInput = document.getElementById('my-peer-id');
        const remotePeerIdInput = document.getElementById('remote-peer-id');
        const msgInput = document.getElementById('msg-input');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const capaActualSpan = document.getElementById('capa-actual');

        const CONTACTS_KEY = 'arbolapp_contacts';
        let contacts = [];

        const ID_KEY = 'arbolapp_device_id';
        function generarNuevoId() {
            return window.crypto?.randomUUID?.() || 'user_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
        }
        function obtenerIdDispositivo() {
            let id = localStorage.getItem(ID_KEY);
            if (!id) {
                id = generarNuevoId();
                localStorage.setItem(ID_KEY, id);
            }
            return id;
        }

        function reiniciarId() {
            if (confirm('¿Generar un nuevo ID? Esto reiniciará las conexiones actuales.')) {
                const nuevoId = generarNuevoId();
                localStorage.setItem(ID_KEY, nuevoId);
                enviarAlMotor('REINICIAR_CON_ID', { id: nuevoId });
            }
        }

        function enviarAlMotor(tipo, datos = {}) {
            if (p2pIframe?.contentWindow) {
                p2pIframe.contentWindow.postMessage({ type: tipo, data: datos }, '*');
            }
        }

        window.addEventListener('load', () => {
            setTimeout(() => enviarAlMotor('INIT', { id: obtenerIdDispositivo() }), 500);
        });

        window.addEventListener('message', (event) => {
            const { type, data } = event.data;
            switch (type) {
                case 'MI_ID':
                    myPeerIdInput.value = data;
                    logP2P(`✅ ID asignado: ${data}`);
                    break;
                case 'LLAMADA_ENTRANTE':
                    remotePeerIdInput.value = data;
                    addSystemMessage(`📞 Llamada entrante de: ${data}`);
                    logP2P(`Llamada entrante de: ${data}`);
                    switchP2PTab('chat');
                    break;
                case 'CONEXION_ESTABLECIDA':
                    actualizarEstado('connected');
                    addSystemMessage('✅ Conectado');
                    break;
                case 'CONEXION_CERRADA':
                    actualizarEstado('idle');
                    addSystemMessage('🔌 Desconectado');
                    break;
                case 'MENSAJE_RECIBIDO':
                    addMessage(data, 'received');
                    break;
                case 'ERROR_P2P':
                    actualizarEstado('idle');
                    addSystemMessage(`⚠️ Error: ${data}`);
                    logP2P(`ERROR: ${data}`);
                    break;
                case 'LOG':
                    logP2P(data);
                    break;
                case 'CAPA_ACTUAL':
                    capaActualSpan.innerText = data;
                    break;
            }
        });

        // ========== FUNCIONES DE UI (iguales) ==========
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message msg-${type}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg-system';
            div.innerText = `--- ${text} ---`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        function logP2P(mensaje) {
            const logDiv = document.getElementById('p2p-log');
            if (!logDiv) return;
            const time = new Date().toLocaleTimeString().split(' ')[0];
            logDiv.innerHTML += `<div>[${time}] ${mensaje}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        function actualizarEstado(estado) {
            statusIndicator.className = 'status-indicator';
            if (estado === 'idle') {
                statusIndicator.classList.add('status-idle');
                statusText.innerText = 'Desconectado';
            } else if (estado === 'calling') {
                statusIndicator.classList.add('status-calling');
                statusText.innerText = 'Conectando...';
            } else if (estado === 'connected') {
                statusIndicator.classList.add('status-connected');
                statusText.innerText = 'En línea';
            }
        }
        function copyMyId() {
            myPeerIdInput.select();
            navigator.clipboard?.writeText(myPeerIdInput.value).then(() => alert("ID copiado")).catch(() => document.execCommand('copy'));
        }
        function openP2P() {
            document.getElementById('p2p-modal').showModal();
            myPeerIdInput.value = obtenerIdDispositivo();
            msgInput.focus();
            loadContacts();
        }
        function closeP2P() { document.getElementById('p2p-modal').close(); }
        function handleSendMessage() {
            const texto = msgInput.value.trim();
            if (!texto) return;
            const idRemoto = remotePeerIdInput.value.trim();
            if (!idRemoto) { addSystemMessage('⚠️ Debes ingresar un ID remoto'); return; }
            msgInput.value = '';
            addMessage(texto, 'pending');
            enviarAlMotor('ENVIAR_MENSAJE', { texto, idRemoto });
            actualizarEstado('calling');
        }
        function conectarLlamada() {
            const idRemoto = remotePeerIdInput.value.trim();
            if (!idRemoto) { alert('Ingresa un ID remoto'); return; }
            enviarAlMotor('CONECTAR', { idRemoto });
            actualizarEstado('calling');
        }

        // ========== PESTAÑAS Y CONTACTOS (igual) ==========
        function switchP2PTab(tab) { /* ... */ }
        function loadContacts() { /* ... */ }
        function renderContacts() { /* ... */ }
        function addContact() { /* ... */ }
        function deleteContact(index) { /* ... */ }

        // ========== RESTO DE FUNCIONES (FEED, POSTS) ==========
        const LOCAL_STORAGE_KEY = 'arbolapp_posts_v1';
        let currentFeedTab = 'my-posts';
        async function loadPostsData() { /* ... */ }
        function publishPost() { /* ... */ }
        async function exportToJson() { /* ... */ }
        function clearLocalData() { /* ... */ }
        function switchSidebarTab(tab, event) { /* ... */ }
        function switchFeedTab(tab, event) { /* ... */ }
        async function loadMyPosts() { /* ... */ }
        async function loadBranches() { /* ... */ }
        function createPostCard(post, isOwn) { /* ... */ }

        document.addEventListener('DOMContentLoaded', () => {
            loadMyPosts();
            if (msgInput) {
                msgInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); }
                });
            }
        });
    </script>
</body>
</html>
